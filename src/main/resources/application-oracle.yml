# Perfil Oracle. Credenciais SEMPRE via variaveis de ambiente (nunca commitar senha).
#   DB_URL       ex.: jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL   (FIAP)
#                ou   jdbc:oracle:thin:@localhost:1521/FREEPDB1         (docker-compose)
#   DB_USERNAME  ex.: RM555555
#   DB_PASSWORD  ex.: ddmmaa (data de nascimento, padrao FIAP)
spring:
  datasource:
    url: ${DB_URL:jdbc:oracle:thin:@oracle.fiap.com.br:1521:ORCL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 20000
  jpa:
    show-sql: false
