# Perfil padrao: H2 em arquivo (./data). Os dados sobrevivem ao restart da aplicacao.
spring:
  datasource:
    url: jdbc:h2:file:./data/alertaencosta;AUTO_SERVER=TRUE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    show-sql: true
