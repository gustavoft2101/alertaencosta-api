# Oracle local (alternativa ao Oracle da FIAP). Primeira subida leva alguns minutos.
#   docker compose up -d
#   DB_URL=jdbc:oracle:thin:@localhost:1521/FREEPDB1 DB_USERNAME=alertaencosta DB_PASSWORD=alertaencosta \
#     mvn spring-boot:run -Dspring-boot.run.profiles=oracle
services:
  oracle:
    image: gvenzl/oracle-free:23-slim
    container_name: alertaencosta-oracle
    ports:
      - "1521:1521"
    environment:
      ORACLE_PASSWORD: oracle
      APP_USER: alertaencosta
      APP_USER_PASSWORD: alertaencosta
    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
    volumes:
      - oracle-data:/opt/oracle/oradata

volumes:
  oracle-data:
